[package]
name = "colax-lite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Colax Lite — a local-first, zero-knowledge password vault (native UI)"

[dependencies]
base64.workspace = true
colax-core = { path = "../../crates/colax-core" }
dirs = "7.0.0"
# Decoding an uploaded background (and re-encoding it small enough to store),
# then the box blur the CSS's `filter: blur()` does not exist for here. Only
# the codecs a user can actually hand us; the SVG/PNG-encoder defaults stay
# off the tree.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
rodio = "0.20"
serde.workspace = true
serde_json.workspace = true
slint = "1.18.1"
time.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Memory", "Win32_System_ProcessStatus"] }

[build-dependencies]
slint-build = "1"
winres = "0.1.12"
