[package]
name = "colax-lite"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Colax Lite — a local-first, zero-knowledge password vault (native UI)"

[dependencies]
base64.workspace = true
colax-core = { path = "../../crates/colax-core" }
dirs = "7.0.0"
rodio = "0.20"
serde.workspace = true
serde_json.workspace = true
slint = "1.18.1"
time.workspace = true
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_System_Memory"] }

[build-dependencies]
slint-build = "1"
winres = "0.1.12"
