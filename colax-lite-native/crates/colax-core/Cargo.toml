[package]
name = "colax-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Colax Lite's vault engine: crypto, model, normalisers, storage. No UI."

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
# TOTP (Task 1.2): BASE32_NOPAD decode/encode, HMAC-SHA1 codes, and the QR
# matrix the authenticator screen paints. No default features on qrcode —
# they pull in image/svg/pic renderers the crate never uses.
data-encoding = "2"
hmac.workspace = true
pbkdf2.workspace = true
qrcode = { version = "0.14", default-features = false }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
subtle.workspace = true
time.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true
zeroize.workspace = true
