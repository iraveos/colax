[package]
name = "colax-tauri"
version = "0.1.0"
description = "Colax — Tauri 2 shell for the existing React frontend"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

# A vault should be small on disk and quick to start: optimise for size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
